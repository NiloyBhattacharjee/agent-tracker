<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- userSpaceOnUse: a bounding-box gradient paints nothing on perfectly horizontal strokes (zero-height box) -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="58" y1="134" x2="210" y2="206">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- window -->
  <rect x="14" y="22" width="228" height="212" rx="30" fill="url(#body)"/>
  <rect x="14" y="22" width="228" height="212" rx="30" fill="url(#glow)"/>
  <rect x="16" y="24" width="224" height="208" rx="28" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- title bar -->
  <path d="M18 68 H238" stroke="#334155" stroke-width="3"/>
  <circle cx="48" cy="46" r="8.5" fill="#ff5f57"/>
  <circle cx="74" cy="46" r="8.5" fill="#febc2e"/>
  <circle cx="100" cy="46" r="8.5" fill="#28c840"/>

  <!-- prompt + cursor -->
  <path d="M42 94 L56 104 L42 114" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="64" y="108" width="20" height="6" rx="2" fill="#22d3ee" opacity="0.85"/>

  <!-- A T, drawn as strokes so it renders the same everywhere -->
  <g fill="none" stroke="url(#ink)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 206 L93 134 L128 206"/>
    <path d="M73 180 H113"/>
    <path d="M148 134 H210"/>
    <path d="M179 134 V206"/>
  </g>
</svg>
