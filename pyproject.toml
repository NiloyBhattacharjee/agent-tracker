[project]
name = "agent-tracker"
version = "0.1.0"
description = "Live dashboard for every coding agent (Claude Code, Codex, Copilot) in terminal or VS Code: what each is doing, context window, who needs you, file conflicts"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
agents = "tracker:main"

[tool.setuptools]
py-modules = ["tracker"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
