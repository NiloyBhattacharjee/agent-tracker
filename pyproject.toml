[project]
name = "agent-tracker"
version = "0.1.0"
description = "Live terminal dashboard for every Claude Code agent: what it's doing, tokens, project, and what's next"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
agents = "tracker:main"

[tool.setuptools]
py-modules = ["tracker"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
