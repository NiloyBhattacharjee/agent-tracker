# Push a tag like v0.2.0 → test, package the extension at that version, attach the .vsix to a GitHub
# release, and publish to the VS Code Marketplace / Open VSX when their tokens are set as repo secrets.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # create the GitHub release
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: python test_tracker.py && node vscode-extension/test.js
      - name: Package
        working-directory: vscode-extension
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npx --yes @vscode/vsce@3 package
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vscode-extension/*.vsix --generate-notes
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce@3 publish --packagePath *.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: vscode-extension
        run: npx --yes ovsx publish *.vsix
